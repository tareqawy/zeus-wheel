<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>عجلة الحظ - TAEMBOT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js?v=1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        #game {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 5s cubic-bezier(0.2, 0.9, 0.1, 1);
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .pin {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            z-index: 20;
        }
        
        .button {
            width: 60px;
            height: 60px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 15;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        
        .button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        
        .button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #result_box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: none;
            z-index: 100;
            white-space: nowrap;
        }
        
        .win-result {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            box-shadow: 0 0 20px #4caf50;
        }
        
        .respin-result {
            background: linear-gradient(135deg, #ffc107, #ff8f00);
            box-shadow: 0 0 20px #ffc107;
        }
        
        .lose-result {
            background: linear-gradient(135deg, #f44336, #c62828);
        }
        
        #clock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            z-index: 10;
        }
        
        @media (max-width: 600px) {
            #game {
                width: 250px;
                height: 250px;
            }
            #result_box {
                font-size: 14px;
                padding: 10px 20px;
                bottom: 80px;
            }
            #clock {
                font-size: 12px;
                white-space: normal;
                width: 90%;
                text-align: center;
            }
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 1000;
        }
        
        .bounce {
            animation: bounce 0.3s ease;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="game">
        <img class="pin" id="pin" src="static/wheel_assets/pin.png" onerror="this.style.display='none'">
        <img class="wheel" id="wheel" src="static/wheel_assets/wheel.png" onerror="this.src='https://tareqawy.github.io/zeus-wheel/static/wheel_assets/wheel.png'">
        <img class="button" id="spinBtn" src="static/wheel_assets/button.png" onerror="this.src='https://tareqawy.github.io/zeus-wheel/static/wheel_assets/button.png'">
    </div>
    <div id="result_box"></div>
    <div id="clock">🎡 جاري التحميل... 🎡</div>

    <script>
        (function() {
            // انتظار تحميل Telegram WebApp
            let tg = null;
            let userId = null;
            let canSpin = true;
            let isSpinning = false;
            let hasRespin = false;
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            const resultBox = document.getElementById('result_box');
            const clockEl = document.getElementById('clock');
            
            // محاولة الاتصال بـ Telegram WebApp
            if (typeof window.TelegramWebApp !== 'undefined') {
                tg = window.TelegramWebApp;
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userId = tg.initDataUnsafe.user.id;
                }
                console.log('✅ Telegram WebApp متصل');
            } else {
                console.log('⚠️ ليس داخل تليجرام - وضع اختبار');
                // وضع اختبار للمتصفح العادي
                tg = {
                    ready: function() {},
                    expand: function() {},
                    sendData: function(data) { console.log('إرسال:', data); }
                };
                canSpin = true;
                clockEl.innerText = '🎡 وضع الاختبار - اضغط للدوران 🎡';
                spinBtn.classList.remove('disabled');
            }
            
            // ترتيب الجوائز
            const SEGMENT_ANGLE = 45;
            const CALIBRATION = 22.5;
            
            function calculateDegreeForPrize(prizeType) {
                let prizeIndex = 4; // هارد لوك افتراضي
                switch(prizeType) {
                    case 'respin': prizeIndex = 1; break;
                    case 'win_10000': prizeIndex = 2; break;
                    default: prizeIndex = 4;
                }
                let targetSectorMid = (prizeIndex * SEGMENT_ANGLE) + (SEGMENT_ANGLE / 2);
                let requiredAngle = (targetSectorMid - CALIBRATION + 360) % 360;
                let fullRotations = 360 * (Math.floor(Math.random() * 8) + 8);
                return fullRotations + requiredAngle;
            }
            
            function showResult(prizeName, isWin, isRespin) {
                resultBox.style.display = 'block';
                resultBox.innerText = prizeName;
                
                if (isRespin) {
                    resultBox.className = 'respin-result';
                } else if (isWin) {
                    resultBox.className = 'win-result';
                } else {
                    resultBox.className = 'lose-result';
                }
                
                setTimeout(() => {
                    resultBox.style.display = 'none';
                }, 3000);
            }
            
            function performSpin(targetDegree, prizeName, isWin, isRespin) {
                if (isSpinning) return;
                isSpinning = true;
                spinBtn.classList.add('disabled');
                
                wheel.style.transition = 'transform 5s cubic-bezier(0.2, 0.9, 0.1, 1)';
                wheel.style.transform = `rotate(${targetDegree}deg)`;
                
                setTimeout(() => {
                    wheel.style.transition = 'none';
                    wheel.style.transform = `rotate(${targetDegree % 360}deg)`;
                    
                    showResult(prizeName, isWin, isRespin);
                    
                    if (isRespin) {
                        hasRespin = true;
                        canSpin = true;
                        clockEl.innerText = '🎉 لديك فرصة إضافية! اضغط للدوران 🎉';
                        spinBtn.classList.remove('disabled');
                    } else {
                        canSpin = false;
                        clockEl.innerText = '⏰ انتهت دوراتك اليوم. عاود غداً!';
                        spinBtn.classList.add('disabled');
                    }
                    
                    isSpinning = false;
                    
                    // إعلام البوت
                    if (tg) tg.sendData(JSON.stringify({ action: 'spin_done' }));
                }, 5000);
            }
            
            // طلب الحالة من البوت
            function getStatus() {
                if (tg) {
                    tg.sendData(JSON.stringify({ action: 'get_status' }));
                }
            }
            
            // استقبال البيانات من البوت
            window.addEventListener('message', function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('📩 من البوت:', data);
                    
                    if (data.action === 'status_response') {
                        canSpin = data.can_spin;
                        hasRespin = data.has_respin || false;
                        clockEl.innerText = data.message || (canSpin ? '🎡 اضغط للدوران 🎡' : '⏰ عاود غداً!');
                        if (canSpin) {
                            spinBtn.classList.remove('disabled');
                        } else {
                            spinBtn.classList.add('disabled');
                        }
                    }
                    
                    if (data.action === 'spin_result') {
                        const targetDegree = calculateDegreeForPrize(data.prize_type);
                        performSpin(targetDegree, data.prize_name, data.is_win, data.is_respin);
                    }
                    
                    if (data.action === 'error') {
                        clockEl.innerText = `❌ ${data.message}`;
                        spinBtn.classList.remove('disabled');
                        isSpinning = false;
                    }
                    
                } catch(e) {
                    console.log('خطأ في معالجة الرسالة:', e);
                }
            });
            
            // زر الدوران
            spinBtn.addEventListener('click', function() {
                if (isSpinning) {
                    clockEl.innerText = '⏳ العجلة تدور حالياً...';
                    return;
                }
                
                if (!canSpin && !hasRespin) {
                    clockEl.innerText = '⏰ لا توجد دورات متاحة اليوم!';
                    return;
                }
                
                if (hasRespin) {
                    tg.sendData(JSON.stringify({ action: 'use_respin' }));
                    hasRespin = false;
                } else {
                    tg.sendData(JSON.stringify({ action: 'spin' }));
                }
                
                spinBtn.classList.add('disabled');
                clockEl.innerText = '🎡 جاري الدوران... 🎡';
            });
            
            // بدء التشغيل
            setTimeout(() => {
                getStatus();
                clockEl.innerText = '🎡 اضغط على الزر للدوران 🎡';
                if (canSpin) spinBtn.classList.remove('disabled');
            }, 500);
            
            console.log('✅ العجلة جاهزة!');
        })();
    </script>
</body>
</html>
