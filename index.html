<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎡 عجلة الحظ - ZEUSBOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            color: #ffd700;
        }

        .header p {
            font-size: 13px;
            color: #a0a0c0;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff3b3b;
            z-index: 10;
            filter: drop-shadow(0 0 10px rgba(255, 59, 59, 0.8));
        }

        .wheel-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #ff8c00, #ffd700);
            padding: 10px;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.6),
                0 0 80px rgba(255, 140, 0, 0.4),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: 0% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 20%;
            font-size: 11px;
            font-weight: bold;
            color: #1a1a2e;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            text-align: center;
            line-height: 1.2;
            padding-right: 10px;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700, #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.8),
                inset 0 0 10px rgba(0, 0, 0, 0.3);
            z-index: 5;
            border: 4px solid #fff;
        }

        .spin-btn {
            margin-top: 20px;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff3b3b, #ff8c00);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 8px 25px rgba(255, 59, 59, 0.5),
                0 0 30px rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background: linear-gradient(45deg, #555, #333);
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.6;
        }

        .spin-btn:not(:disabled):hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 30px rgba(255, 59, 59, 0.7),
                0 0 40px rgba(255, 140, 0, 0.5);
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #ffd700;
            text-align: center;
            min-height: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .status.error {
            color: #ff3b3b;
        }

        .status.success {
            color: #4caf50;
        }

        .spinning {
            animation: spin 0.3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .result-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-content {
            background: linear-gradient(135deg, #2a2a4e, #1a1a2e);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-emoji {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .result-title {
            font-size: 24px;
            color: #ffd700;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .result-message {
            font-size: 16px;
            color: #e0e0ff;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .result-close {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #4caf50, #2e7d32);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .result-close:active {
            transform: scale(0.95);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: confettiFall 3s linear infinite;
            z-index: 99;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎡 عجلة الحظ 🎡</h1>
        <p>جرب حظك واربح جوائز رائعة!</p>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel-outer">
            <div class="wheel" id="wheel"></div>
            <div class="wheel-center">🎰</div>
        </div>
    </div>

    <button class="spin-btn" id="spinBtn" disabled>جاري التحميل...</button>

    <div class="status" id="status">جارٍ الاتصال بتيليجرام<span class="loading-dots"></span></div>

    <!-- نافذة النتيجة -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <span class="result-emoji" id="resultEmoji">🎉</span>
            <div class="result-title" id="resultTitle">مبروك!</div>
            <div class="result-message" id="resultMessage"></div>
            <button class="result-close" id="resultClose">حسناً</button>
        </div>
    </div>

    <script>
        // ============================================
        // ثوابت العجلة — يجب أن تطابق WHEEL_PRIZES في mainbot.py
        // ============================================
        const PRIZES = [
            { name: 'هارد لوك 😢',  type: 'hard_luck', value: 0,     color: '#ff6b6b', textColor: '#fff' },
            { name: 'ريسبن 🔄',      type: 'respin',    value: 0,     color: '#4ecdc4', textColor: '#1a1a2e' },
            { name: '10000 ليرة 💰', type: 'win',       value: 10000, color: '#ffd700', textColor: '#1a1a2e' },
        ];

        // ============================================
        // متغيرات الحالة
        // ============================================
        let tg = null;
        let isSpinning = false;
        let currentRotation = 0;

        const wheelEl = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const statusEl = document.getElementById('status');
        const resultModal = document.getElementById('resultModal');
        const resultEmoji = document.getElementById('resultEmoji');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const resultClose = document.getElementById('resultClose');

        // ============================================
        // بناء العجلة بصريًا
        // ============================================
        function buildWheel() {
            const segmentAngle = 360 / PRIZES.length;
            wheelEl.innerHTML = '';

            PRIZES.forEach((prize, index) => {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                segment.style.background = prize.color;
                segment.style.color = prize.textColor;
                segment.style.transform = `rotate(${index * segmentAngle}deg) skewY(${90 - segmentAngle}deg)`;
                segment.textContent = prize.name;
                wheelEl.appendChild(segment);
            });
        }

        // ============================================
        // عرض حالة
        // ============================================
        function setStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status ' + type;
        }

        // ============================================
        // عرض النتيجة في نافذة
        // ============================================
        function showResult(prize) {
            resultModal.classList.add('show');

            if (prize.type === 'win') {
                resultEmoji.textContent = '🎉';
                resultTitle.textContent = 'مبروك!';
                resultMessage.innerHTML = `ربحت <b style="color:#ffd700">${prize.name}</b><br>`;
                spawnConfetti();
            } else if (prize.type === 'respin') {
                resultEmoji.textContent = '🔄';
                resultTitle.textContent = 'حظ سعيد!';
                resultMessage.innerHTML = `حصلت على <b>${prize.name}</b><br>يمكنك المحاولة مرة أخرى!`;
            } else {
                resultEmoji.textContent = '😢';
                resultTitle.textContent = 'حظ أوفر!';
                resultMessage.innerHTML = `حصلت على <b>${prize.name}</b><br>جرب حظك غداً!`;
            }
        }

        // ============================================
        // قصاصات الاحتفال
        // ============================================
        function spawnConfetti() {
            const colors = ['#ffd700', '#ff3b3b', '#4caf50', '#2196f3', '#e91e63'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // ============================================
        // تدوير العجلة إلى الجائزة المطلوبة
        // ============================================
        function rotateToPrize(prizeIndex) {
            const segmentAngle = 360 / PRIZES.length;
            // زاوية الجائزة: منتصف القطاع
            const targetAngle = (prizeIndex * segmentAngle) + (segmentAngle / 2);
            // دوران كامل + زاوية الهدف (اتجاه عكس عقارب الساعة ليصعد القطاع للاعلى)
            const extraSpins = 5 + Math.floor(Math.random() * 3);
            const finalRotation = currentRotation + (extraSpins * 360) + (360 - targetAngle);

            wheelEl.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation;
        }

        // ============================================
        // معالج زر الدوران
        // ============================================
        function handleSpin() {
            if (isSpinning) return;
            if (!tg) {
                setStatus('❌ يجب فتح العجلة من داخل تيليجرام', 'error');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            setStatus('🎲 جاري إرسال طلب الدوران...');

            try {
                // ✅ نرسل فقط action = request_spin — البوت يختار الجائزة
                tg.sendData(JSON.stringify({
                    action: 'request_spin'
                }));

                setStatus('✅ تم إرسال طلبك! تفقد رسالة البوت للنتيجة.', 'success');

                // إظهار رسالة توضيحية
                setTimeout(() => {
                    resultModal.classList.add('show');
                    resultEmoji.textContent = '📩';
                    resultTitle.textContent = 'تم إرسال طلبك';
                    resultMessage.innerHTML = 'ستظهر نتيجتك في محادثة البوت خلال لحظات.<br>راجع رسائل البوت الآن!';
                }, 500);

            } catch (err) {
                console.error('sendData error:', err);
                setStatus('❌ حدث خطأ، حاول مرة أخرى', 'error');
                isSpinning = false;
                spinBtn.disabled = false;
            }
        }

        // ============================================
        // إغلاق نافذة النتيجة
        // ============================================
        resultClose.addEventListener('click', () => {
            resultModal.classList.remove('show');
            // إغلاق WebApp بعد إظهار النتيجة
            if (tg) {
                setTimeout(() => {
                    try { tg.close(); } catch (e) {}
                }, 300);
            }
        });

        // ============================================
        // تهيئة التطبيق
        // ============================================
        function init() {
            buildWheel();

            // التحقق من وجود Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;

                // تهيئة
                tg.ready();
                tg.expand();

                // تعيين ألوان متوافقة
                try {
                    tg.setHeaderColor('#1a1a2e');
                    tg.setBackgroundColor('#1a1a2e');
                } catch (e) {
                    console.log('Theme API not available');
                }

                // التحقق من وجود بيانات المستخدم
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    setStatus(`👋 أهلاً ${user.first_name}! اضغط للدوران`, '');
                    spinBtn.disabled = false;
                    spinBtn.textContent = '🎡 ابدأ الدوران';
                } else {
                    // قد يكون initDataUnsafe فارغاً في بعض الحالات
                    setStatus('👋 أهلاً! اضغط للدوران', '');
                    spinBtn.disabled = false;
                    spinBtn.textContent = '🎡 ابدأ الدوران';
                }

            } else {
                // ليس داخل تيليجرام
                setStatus('⚠️ افتح العجلة من داخل بوت تيليجرام', 'error');
                spinBtn.textContent = 'غير متاح';
                spinBtn.disabled = true;
            }

            // ربط الأحداث
            spinBtn.addEventListener('click', handleSpin);
        }

        // بدء التطبيق عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', init);

        // في حال DOM جاهز بالفعل
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
