<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>عجلة الحظ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #game {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 4s cubic-bezier(0.2, 0.9, 0.1, 1);
        }
        .pin {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            z-index: 20;
        }
        .button {
            width: 60px;
            height: 60px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 15;
            border-radius: 50%;
        }
        .button:active { transform: translate(-50%, -50%) scale(0.95); }
        .button.disabled { opacity: 0.5; cursor: not-allowed; }
        #result_box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.85);
            border-radius: 50px;
            color: white;
            font-size: 16px;
            display: none;
            z-index: 100;
        }
        .win-result { background: #4caf50; }
        .respin-result { background: #ffc107; }
        .lose-result { background: #f44336; }
        #clock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 13px;
            text-align: center;
        }
        @media (max-width: 600px) {
            #game { width: 250px; height: 250px; }
            #result_box { font-size: 14px; bottom: 80px; }
        }
    </style>
</head>
<body>
    <div id="game">
        <img class="pin" id="pin" src="static/wheel_assets/pin.png">
        <img class="wheel" id="wheel" src="static/wheel_assets/wheel.png">
        <img class="button" id="spinBtn" src="static/wheel_assets/button.png">
    </div>
    <div id="result_box"></div>
    <div id="clock">🎡 اضغط للدوران 🎡</div>

    <script>
        const API_URL = "http://2.27.62.215:5000";
        
        let tg = window.TelegramWebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        let userId = tg?.initDataUnsafe?.user?.id || 'test_' + Date.now();
        let isSpinning = false;
        let canSpin = true;
        
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultBox = document.getElementById('result_box');
        const clockEl = document.getElementById('clock');
        
        const SEGMENT_ANGLE = 45;
        const CALIBRATION = 22.5;
        
        function calculateDegreeForPrize(prizeType) {
            let prizeIndex = 4;
            if (prizeType === 'respin') prizeIndex = 1;
            else if (prizeType === 'win') prizeIndex = 2;
            let targetSectorMid = (prizeIndex * SEGMENT_ANGLE) + (SEGMENT_ANGLE / 2);
            let requiredAngle = (targetSectorMid - CALIBRATION + 360) % 360;
            let fullRotations = 360 * (Math.floor(Math.random() * 9) + 8);
            return fullRotations + requiredAngle;
        }
        
        function performSpin(prizeName, prizeType, isWin, isRespin) {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled');
            
            const targetDegree = calculateDegreeForPrize(prizeType);
            wheel.style.transform = `rotate(${targetDegree}deg)`;
            
            setTimeout(() => {
                resultBox.style.display = 'block';
                resultBox.innerText = prizeName;
                if (isWin) resultBox.className = 'win-result';
                else if (isRespin) resultBox.className = 'respin-result';
                else resultBox.className = 'lose-result';
                setTimeout(() => { resultBox.style.display = 'none'; }, 3000);
                
                if (isRespin) {
                    canSpin = true;
                    clockEl.innerText = '🎉 فرصة إضافية! اضغط للدوران 🎉';
                    spinBtn.classList.remove('disabled');
                } else {
                    canSpin = false;
                    clockEl.innerText = '⏰ عاود غداً!';
                }
                isSpinning = false;
            }, 4000);
        }
        
        async function getStatus() {
            try {
                const res = await fetch(`${API_URL}/status?user_id=${userId}`);
                const data = await res.json();
                canSpin = data.can_spin;
                clockEl.innerText = data.message;
                if (canSpin) spinBtn.classList.remove('disabled');
            } catch(e) { console.error(e); }
        }
        
        async function doSpin() {
            if (!canSpin || isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled');
            clockEl.innerText = '🎡 جاري الدوران...';
            
            try {
                const res = await fetch(`${API_URL}/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.error) {
                    clockEl.innerText = '❌ ' + data.error;
                    spinBtn.classList.remove('disabled');
                    isSpinning = false;
                    return;
                }
                performSpin(data.prize_name, data.prize_type, data.is_win, data.is_respin);
                if (tg && data.prize_value > 0) {
                    tg.sendData(JSON.stringify({
                        action: 'spin_result',
                        prize_name: data.prize_name,
                        prize_value: data.prize_value,
                        signature: data.signature,
                        user_id: userId
                    }));
                }
            } catch(e) {
                console.error(e);
                clockEl.innerText = '❌ خطأ في الاتصال';
                spinBtn.classList.remove('disabled');
                isSpinning = false;
            }
        }
        
        spinBtn.onclick = () => { if (canSpin && !isSpinning) doSpin(); };
        getStatus();
    </script>
</body>
</html>
