<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>عجلة الحظ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        #game {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 4s cubic-bezier(0.2, 0.9, 0.1, 1);
        }
        .pin {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            z-index: 20;
        }
        .button {
            width: 60px;
            height: 60px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 15;
            border-radius: 50%;
        }
        .button:active { transform: translate(-50%, -50%) scale(0.95); }
        .button.disabled { opacity: 0.5; cursor: not-allowed; }
        #result_box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
        .win-result { background: linear-gradient(135deg, #4caf50, #2e7d32); box-shadow: 0 0 15px #4caf50; }
        .respin-result { background: linear-gradient(135deg, #ffc107, #ff8f00); box-shadow: 0 0 15px #ffc107; }
        .lose-result { background: linear-gradient(135deg, #f44336, #c62828); }
        #clock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
        }
        @media (max-width: 600px) {
            #game { width: 250px; height: 250px; }
            #result_box { font-size: 14px; padding: 8px 16px; bottom: 80px; white-space: normal; max-width: 90%; }
            #clock { font-size: 11px; white-space: normal; width: 90%; }
        }
    </style>
</head>
<body>
    <div id="game">
        <img class="pin" id="pin" src="static/wheel_assets/pin.png">
        <img class="wheel" id="wheel" src="static/wheel_assets/wheel.png">
        <img class="button" id="spinBtn" src="static/wheel_assets/button.png">
    </div>
    <div id="result_box"></div>
    <div id="clock">🎡 مرحباً! اضغط للدوران 🎡</div>

    <script>
        // إعدادات السيرفر - غير الرابط إلى VPS حقك
        const API_URL = "http://YOUR_VPS_IP:5000";
        
        let tg = window.TelegramWebApp;
        tg.ready();
        tg.expand();
        
        let userId = tg.initDataUnsafe?.user?.id || 'test_' + Date.now();
        let isSpinning = false;
        let canSpin = true;
        
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const resultBox = document.getElementById('result_box');
        const clockEl = document.getElementById('clock');
        
        // زوايا العجلة
        const SEGMENT_ANGLE = 45;
        const CALIBRATION = 22.5;
        
        function calculateDegreeForPrize(prizeType) {
            let prizeIndex = 4;
            switch(prizeType) {
                case 'respin': prizeIndex = 1; break;
                case 'win': prizeIndex = 2; break;
                default: prizeIndex = 4;
            }
            let targetSectorMid = (prizeIndex * SEGMENT_ANGLE) + (SEGMENT_ANGLE / 2);
            let requiredAngle = (targetSectorMid - CALIBRATION + 360) % 360;
            let fullRotations = 360 * (Math.floor(Math.random() * 9) + 8);
            return fullRotations + requiredAngle;
        }
        
        function performSpin(prizeName, prizeType, isWin, isRespin) {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add('disabled');
            
            const targetDegree = calculateDegreeForPrize(prizeType);
            
            wheel.style.transition = 'transform 4s cubic-bezier(0.2, 0.9, 0.1, 1)';
            wheel.style.transform = `rotate(${targetDegree}deg)`;
            
            setTimeout(() => {
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(${targetDegree % 360}deg)`;
                
                resultBox.style.display = 'block';
                resultBox.innerText = prizeName;
                if (isWin) resultBox.className = 'win-result';
                else if (isRespin) resultBox.className = 'respin-result';
                else resultBox.className = 'lose-result';
                
                setTimeout(() => { resultBox.style.display = 'none'; }, 3000);
                
                if (isRespin) {
                    canSpin = true;
                    clockEl.innerText = '🎉 فرصة إضافية! اضغط للدوران 🎉';
                    spinBtn.classList.remove('disabled');
                } else {
                    canSpin = false;
                    clockEl.innerText = '⏰ عاود غداً!';
                    spinBtn.classList.add('disabled');
                }
                
                isSpinning = false;
            }, 4000);
        }
        
        async function getStatus() {
            try {
                const response = await fetch(`${API_URL}/status?user_id=${userId}`);
                const data = await response.json();
                canSpin = data.can_spin;
                clockEl.innerText = data.message;
                if (canSpin) spinBtn.classList.remove('disabled');
                else spinBtn.classList.add('disabled');
            } catch(e) {
                console.error('خطأ:', e);
                clockEl.innerText = '⚠️ مشكلة في الاتصال';
            }
        }
        
        async function doSpin() {
            try {
                const response = await fetch(`${API_URL}/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await response.json();
                
                if (data.error) {
                    clockEl.innerText = `❌ ${data.error}`;
                    spinBtn.classList.remove('disabled');
                    isSpinning = false;
                    return;
                }
                
                performSpin(data.prize_name, data.prize_type, data.is_win, data.is_respin);
                
                // إرسال إشعار للبوت (اختياري)
                tg.sendData(JSON.stringify({
                    action: 'spin_result',
                    prize: data.prize_name,
                    value: data.prize_value
                }));
                
            } catch(e) {
                console.error('خطأ:', e);
                clockEl.innerText = '❌ حدث خطأ، حاول مرة أخرى';
                spinBtn.classList.remove('disabled');
                isSpinning = false;
            }
        }
        
        spinBtn.addEventListener('click', () => {
            if (isSpinning) { clockEl.innerText = '⏳ العجلة تدور...'; return; }
            if (!canSpin) { clockEl.innerText = '⏰ لا توجد دورات!'; return; }
            
            isSpinning = true;
            spinBtn.classList.add('disabled');
            clockEl.innerText = '🎡 جاري الدوران... 🎡';
            doSpin();
        });
        
        // بدء التشغيل
        getStatus();
    </script>
</body>
</html>
