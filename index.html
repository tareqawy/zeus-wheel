<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Spinning-Wheel - TAEMBOT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="static/wheel_assets/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* نفس الـ style الذي لديك، أضف فقط هذه الإضافات */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #555;
            border-top-color: #ffc107;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }
        
        @keyframes pulseButton {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .button-centered.attention {
            animation: pulseButton 1.5s ease-in-out infinite;
        }

        #result_box {
            position: fixed;
            left: 50%;
            top: 70%;
            transform: translateX(-50%);
            padding: 20px 30px;
            min-width: 280px;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            display: none;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            z-index: 10;
            letter-spacing: 0.5px;
        }
        
        .win-result {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.95), rgba(139, 195, 74, 0.9));
            border: 3px solid rgba(76, 175, 80, 0.9);
            animation: winPulse 0.5s ease-out;
        }
        
        .lose-result {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.95), rgba(233, 30, 99, 0.9));
            border: 3px solid rgba(244, 67, 54, 0.9);
        }
        
        .respin-result {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.95), rgba(255, 152, 0, 0.9));
            border: 3px solid rgba(255, 193, 7, 0.9);
            animation: respinGlow 1s ease-in-out infinite alternate;
        }
        
        @keyframes winPulse {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        
        @keyframes respinGlow {
            0% { box-shadow: 0 0 10px #ffc107; }
            100% { box-shadow: 0 0 30px #ffc107; }
        }

        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
        
        @media(max-width:600px){
            #result_box {
                min-width: 220px;
                max-width: 90%;
                font-size: 18px;
                padding: 18px 25px;
                top: 65%;
            }
            .clock-custom {
                font-size: 10px !important;
                padding: 10px 16px !important;
                min-width: 160px !important;
                top: 60% !important;
            }
        }
        
        .clock-custom {
            position: absolute !important;
            top: calc(100% + 20px) !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            padding: 12px 20px !important;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)) !important;
            backdrop-filter: blur(10px) !important;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 25px !important;
            color: #ffffff !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            text-align: center !important;
            white-space: normal !important;
            word-break: break-word !important;
            width: auto !important;
            max-width: 90vw !important;
            z-index: 5 !important;
        }

        .button-centered {
            width: 60px;
            height: 60px;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%);
            z-index: 10 !important;
            cursor: pointer !important;
        }

        .button-centered.disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
        }
        
        .button-centered.respin-active {
            animation: pulseButton 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body id="body-header">
    <div id="game">
        <img class="pin" id="pin" src="static/wheel_assets/pin.png">
        <img class="wheel" src="static/wheel_assets/wheel.png">
        <img class="button button-centered" id="disable" src="static/wheel_assets/button.png">
        <p class="clock clock-custom" id="clock">🎡 جاري التحميل... 🎡</p>
    </div>

    <div id="result_box"></div>
    <canvas id="confetti"></canvas>

    <script>
        // ============================================================
        // الاتصال مع بوت التليجرام
        // ============================================================
        
        let tg = window.TelegramWebApp;
        tg.ready();
        tg.expand();
        
        let userId = tg.initDataUnsafe?.user?.id || 'test';
        let canSpin = false;
        let hasRespin = false;
        let isSpinning = false;
        
        // عناصر DOM
        const wheel = document.querySelector('.wheel');
        const startButton = document.querySelector('.button');
        const arrow = document.querySelector('.pin');
        const resultBox = document.getElementById('result_box');
        const confettiCanvas = document.getElementById('confetti');
        const clockElement = document.getElementById('clock');
        
        // ثوابت العجلة
        const SEGMENT_ANGLE = 45;
        const CALIBRATION = 22.5;
        
        // الصوت
        let audio = new Audio('static/wheel_assets/tick.mp3');
        let tickIntervalId = null;
        let tickStartTime = 0;
        
        // ============================================================
        // حساب زاوية التوقف للجائزة
        // ============================================================
        function calculateDegreeForPrize(prizeType) {
            let prizeIndex = 4; // هارد لوك افتراضي
            
            switch(prizeType) {
                case 'respin':
                    prizeIndex = 1;
                    break;
                case 'win_10000':
                    prizeIndex = 2;
                    break;
                case 'hard_luck':
                default:
                    prizeIndex = 4;
                    break;
            }
            
            let targetSectorMid = (prizeIndex * SEGMENT_ANGLE) + (SEGMENT_ANGLE / 2);
            let requiredAngle = (targetSectorMid - CALIBRATION + 360) % 360;
            let fullRotations = 360 * (Math.floor(Math.random() * 8) + 8);
            return fullRotations + requiredAngle;
        }
        
        // ============================================================
        // نظام الصوت
        // ============================================================
        function scheduleNextTick() {
            if (tickIntervalId) clearTimeout(tickIntervalId);
            
            audio.currentTime = 0;
            audio.play().catch(() => {});
            
            const elapsed = Date.now() - tickStartTime;
            const progress = Math.min(elapsed / 5000, 1);
            let nextDelay = 50 + progress * 300;
            
            tickIntervalId = setTimeout(scheduleNextTick, nextDelay);
        }
        
        function playSound() {
            tickStartTime = Date.now();
            scheduleNextTick();
        }
        
        function stopSound() {
            if (tickIntervalId) {
                clearTimeout(tickIntervalId);
                tickIntervalId = null;
            }
            audio.pause();
        }
        
        // ============================================================
        // نظام الاحتفال
        // ============================================================
        function startCelebration() {
            confettiCanvas.style.display = 'block';
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            
            let particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: -20,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    speed: Math.random() * 5 + 3
                });
            }
            
            function draw() {
                if (confettiCanvas.style.display === 'none') return;
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                
                let anyActive = false;
                for (let p of particles) {
                    p.y += p.speed;
                    if (p.y < confettiCanvas.height + 50) {
                        anyActive = true;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                }
                
                if (anyActive) {
                    requestAnimationFrame(draw);
                } else {
                    confettiCanvas.style.display = 'none';
                }
            }
            
            draw();
            
            setTimeout(() => {
                confettiCanvas.style.display = 'none';
            }, 5000);
        }
        
        // ============================================================
        // عرض النتيجة
        // ============================================================
        function showResult(prizeName, isWin, isRespin) {
            resultBox.style.display = 'block';
            resultBox.innerText = prizeName;
            
            if (isRespin) {
                resultBox.className = 'respin-result';
                startButton.classList.add('respin-active');
            } else if (isWin) {
                resultBox.className = 'win-result';
                startButton.classList.remove('respin-active');
                startCelebration();
            } else {
                resultBox.className = 'lose-result';
                startButton.classList.remove('respin-active');
            }
            
            setTimeout(() => {
                resultBox.style.display = 'none';
            }, 3000);
        }
        
        // ============================================================
        // تنفيذ الدوران
        // ============================================================
        function performSpin(targetDegree, prizeName, isWin, isRespin) {
            if (isSpinning) return;
            
            isSpinning = true;
            startButton.style.pointerEvents = 'none';
            startButton.classList.add('disabled');
            startButton.classList.remove('attention', 'respin-active');
            clockElement.style.display = 'none';
            
            if (resultBox) {
                resultBox.style.display = 'none';
                resultBox.className = '';
            }
            
            // تطبيق الدوران
            wheel.style.transition = 'all 5s cubic-bezier(0.2, 0.9, 0.1, 1)';
            wheel.style.transform = `rotate(${targetDegree}deg)`;
            
            // تشغيل الصوت
            playSound();
            
            // انتظار انتهاء الدوران
            const finishSpin = () => {
                stopSound();
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(${targetDegree % 360}deg)`;
                arrow.classList.add('bounce');
                
                showResult(prizeName, isWin, isRespin);
                
                if (isRespin) {
                    clockElement.innerText = '🎉 لديك فرصة إضافية! اضغط للدوران 🎉';
                    startButton.classList.remove('disabled');
                    startButton.classList.add('attention', 'respin-active');
                    canSpin = true;
                    hasRespin = true;
                } else {
                    canSpin = false;
                    startButton.classList.add('disabled');
                    startButton.classList.remove('attention', 'respin-active');
                    clockElement.innerText = '⏰ انتهت دوراتك اليوم. عاود غداً!';
                }
                
                clockElement.style.display = 'block';
                isSpinning = false;
                wheel.removeEventListener('transitionend', finishSpin);
                
                // إعلام البوت بانتهاء الدوران
                tg.sendData(JSON.stringify({ action: 'spin_done' }));
            };
            
            wheel.addEventListener('transitionend', finishSpin, { once: true });
            
            setTimeout(() => {
                if (isSpinning) finishSpin();
            }, 5500);
        }
        
        // ============================================================
        // طلب الحالة من البوت
        // ============================================================
        function getStatus() {
            tg.sendData(JSON.stringify({ action: 'get_status' }));
        }
        
        // ============================================================
        // استقبال البيانات من البوت
        // ============================================================
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                console.log('📩 من البوت:', data);
                
                if (data.action === 'status_response') {
                    canSpin = data.can_spin;
                    hasRespin = data.has_respin;
                    clockElement.innerText = data.message;
                    
                    if (canSpin) {
                        startButton.classList.remove('disabled');
                        startButton.classList.add('attention');
                    } else {
                        startButton.classList.add('disabled');
                        startButton.classList.remove('attention');
                    }
                }
                
                if (data.action === 'spin_result') {
                    const targetDegree = calculateDegreeForPrize(data.prize_type);
                    performSpin(targetDegree, data.prize_name, data.is_win, data.is_respin);
                }
                
            } catch(e) {
                console.log('خطأ في معالجة الرسالة:', e);
            }
        });
        
        // ============================================================
        // زر الدوران
        // ============================================================
        startButton.addEventListener('click', () => {
            if (isSpinning) {
                tg.sendData(JSON.stringify({ action: 'error', message: 'العجلة تدور حالياً' }));
                return;
            }
            
            if (!canSpin && !hasRespin) {
                clockElement.innerText = '⏰ لا توجد دورات متاحة اليوم. عاود غداً!';
                return;
            }
            
            if (hasRespin) {
                tg.sendData(JSON.stringify({ action: 'use_respin' }));
                hasRespin = false;
            } else {
                tg.sendData(JSON.stringify({ action: 'spin' }));
            }
            
            startButton.classList.add('disabled');
            startButton.classList.remove('attention');
            clockElement.innerText = '🎡 جاري الدوران... 🎡';
        });
        
        // إزالة تأثير الارتداد
        arrow.addEventListener('animationend', () => {
            arrow.classList.remove('bounce');
        });
        
        // ============================================================
        // بدء التشغيل
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            wheel.style.transform = 'rotate(0deg)';
            getStatus();
            console.log('✅ العجلة جاهزة!');
        });
        
        window.addEventListener('resize', () => {
            if (confettiCanvas.style.display !== 'none') {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }
        });
    </script>
</body>

</html>
