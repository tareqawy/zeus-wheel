<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎡 ZEUS BOT - Wheel of Fortune</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: radial-gradient(ellipse at center, #0a1128 0%, #000000 100%);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; color: #fff; overflow: hidden; user-select: none; position: relative;
        }

        .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: #4fc3f7; border-radius: 50%; animation: twinkle 2s infinite ease-in-out; }
        @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(.8)} 50%{opacity:1;transform:scale(1.2)} }

        .glow-orb { position: fixed; width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(79,195,247,0.2) 0%, transparent 70%);
            pointer-events: none; z-index: 0; animation: floatOrb 8s infinite ease-in-out; }
        @keyframes floatOrb { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-30px)} }

        .container { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }

        .header { text-align: center; margin-bottom: 20px; animation: fadeInDown 0.8s ease; }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }

        .bot-name {
            font-size: 14px; letter-spacing: 4px; color: #4fc3f7; margin-bottom: 6px;
            font-weight: 700; text-shadow: 0 0 15px rgba(79,195,247,0.8);
            animation: botNamePulse 2s infinite ease-in-out;
        }
        @keyframes botNamePulse {
            0%,100% { opacity: 0.7; letter-spacing: 4px; }
            50% { opacity: 1; letter-spacing: 6px; }
        }

        .header h1 { font-size: 28px; margin-bottom: 8px;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(45deg, #4fc3f7, #1a237e, #4fc3f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            background-size: 200% auto; animation: shineText 3s linear infinite;
            filter: drop-shadow(0 0 15px rgba(79,195,247,0.6)); }
        @keyframes shineText { to { background-position: 200% center; } }
        .header p { font-size: 13px; color: #90caf9; }

        .wheel-wrapper { position: relative; width: 340px; height: 340px; margin: 15px 0;
            display: flex; align-items: center; justify-content: center; }

        .wheel-glow { position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle, rgba(79,195,247,0.4) 0%, transparent 70%);
            animation: pulseGlow 2s infinite ease-in-out; z-index: 0; }
        @keyframes pulseGlow { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.15);opacity:1} }
        .spinning .wheel-glow { animation: pulseGlow 0.4s infinite ease-in-out;
            background: radial-gradient(circle, rgba(41,98,255,0.6) 0%, transparent 70%); }

        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent;
            border-top: 45px solid #4fc3f7; z-index: 10;
            filter: drop-shadow(0 0 15px rgba(79,195,247,1)) drop-shadow(0 0 30px rgba(79,195,247,0.6));
            animation: pointerBounce 1s infinite ease-in-out; }
        @keyframes pointerBounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-5px)} }
        .spinning .pointer { animation: pointerShake 0.1s infinite linear; }
        @keyframes pointerShake { 0%,100%{transform:translateX(-50%) rotate(0)} 25%{transform:translateX(-50%) rotate(-5deg)} 75%{transform:translateX(-50%) rotate(5deg)} }

        .wheel-outer { width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, #4fc3f7, #1a237e, #0d47a1, #4fc3f7);
            padding: 12px;
            box-shadow: 0 0 50px rgba(79,195,247,0.7), 0 0 100px rgba(26,35,126,0.6),
                0 0 150px rgba(79,195,247,0.4), inset 0 0 30px rgba(0,0,0,0.8);
            position: relative; z-index: 2; animation: rotateBorder 8s linear infinite; }
        @keyframes rotateBorder { to { transform: rotate(360deg); } }

        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative;
            overflow: hidden; background: #000000; }

        @keyframes continuousSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ✅ النصوص الجديدة — واضحة ومستقيمة */
        .wheel-label {
            position: absolute;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,1);
            pointer-events: none;
            z-index: 3;
            padding: 4px 8px;
            background: rgba(0,0,0,0.35);
            border-radius: 6px;
            backdrop-filter: blur(2px);
        }

        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4fc3f7, #1a237e, #000000);
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            box-shadow: 0 0 25px rgba(79,195,247,1), 0 0 50px rgba(26,35,126,0.8),
                inset 0 0 15px rgba(255,255,255,0.3), inset 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 5; border: 4px solid #4fc3f7; animation: centerPulse 1.5s infinite ease-in-out; }
        @keyframes centerPulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.08)} }
        .spinning .wheel-center { animation: centerSpin 0.2s infinite linear; }
        @keyframes centerSpin { 0%,100%{transform:translate(-50%,-50%) rotate(-5deg) scale(1.1)} 50%{transform:translate(-50%,-50%) rotate(5deg) scale(1.1)} }

        .spin-btn { margin-top: 25px; padding: 20px 65px; font-size: 22px; font-weight: 900;
            color: #fff; background: linear-gradient(45deg, #0a1128, #1a237e, #4fc3f7, #1a237e, #0a1128);
            background-size: 300% 100%; border: 2px solid #4fc3f7; border-radius: 60px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(79,195,247,0.5), 0 0 40px rgba(26,35,126,0.6),
                inset 0 -4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
            position: relative; overflow: hidden; animation: btnShine 3s infinite linear; z-index: 10;
            font-family: 'Georgia', 'Times New Roman', serif; }
        @keyframes btnShine { 0%{background-position:0% center} 100%{background-position:300% center} }
        .spin-btn::before { content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(79,195,247,0.4) 50%, transparent 70%);
            transform: rotate(45deg); animation: btnShimmer 2s infinite; }
        @keyframes btnShimmer { 0%{transform:translateX(-100%) rotate(45deg)} 100%{transform:translateX(100%) rotate(45deg)} }
        .spin-btn:not(:disabled):active { transform: scale(0.95); }
        .spin-btn:not(:disabled):hover { transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(79,195,247,0.8), 0 0 60px rgba(26,35,126,0.8); }
        .spin-btn:disabled { background: linear-gradient(45deg, #333, #000); cursor: not-allowed;
            box-shadow: none; opacity: 0.6; animation: none; border-color: #333; }
        .spin-btn:disabled::before { display: none; }

        .status { margin-top: 20px; font-size: 17px; color: #4fc3f7; text-align: center;
            min-height: 26px; font-weight: bold; text-shadow: 0 0 15px rgba(79,195,247,0.8);
            animation: fadeIn 0.5s; }
        .status.error { color: #ff3b3b; text-shadow: 0 0 15px rgba(255,59,59,0.8); }
        .status.success { color: #4caf50; text-shadow: 0 0 15px rgba(76,175,80,0.8); }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        .spinning-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(79,195,247,0.15) 0%, transparent 60%);
            pointer-events: none; z-index: 99; animation: screenPulse 0.3s infinite; display: none; }
        .spinning .spinning-screen { display: block; }
        @keyframes screenPulse { 0%,100%{opacity:.3} 50%{opacity:.8} }

        .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%,20%{content:''} 40%{content:'.'} 60%{content:'..'} 80%,100%{content:'...'} }

        @media (max-width: 400px) {
            .wheel-wrapper { width: 300px; height: 300px; }
            .header h1 { font-size: 24px; }
            .spin-btn { padding: 18px 50px; font-size: 18px; }
            .wheel-label { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="glow-orb" style="top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="glow-orb" style="top: 60%; right: 5%; animation-delay: 2s;"></div>
    <div class="glow-orb" style="bottom: 10%; left: 40%; animation-delay: 4s;"></div>

    <div class="spinning-screen"></div>

    <div class="container">
        <div class="header">
            <div class="bot-name">⚡ ZEUS BOT ⚡</div>
            <h1>Wheel of Fortune</h1>
            <p>Try your luck and win amazing prizes!</p>
        </div>

        <div class="wheel-wrapper" id="wheelWrapper">
            <div class="wheel-glow"></div>
            <div class="pointer"></div>
            <div class="wheel-outer">
                <div class="wheel" id="wheel"></div>
                <div class="wheel-center" id="wheelCenter">🎰</div>
            </div>
        </div>

        <button class="spin-btn" id="spinBtn" disabled>Loading...</button>

        <div class="status" id="status">Connecting to Telegram<span class="loading-dots"></span></div>
    </div>

    <script>
        const PRIZES = [
            { name: '20,000 SYP', type: 'win',       value: 20000, color: '#0a1128', textColor: '#4fc3f7' },
            { name: '10,000 SYP', type: 'win',       value: 10000, color: '#1a237e', textColor: '#ffffff' },
            { name: '2,000 SYP',  type: 'win',       value: 2000,  color: '#0d47a1', textColor: '#4fc3f7' },
            { name: 'Respin',     type: 'respin',    value: 0,     color: '#000000', textColor: '#90caf9' },
            { name: 'Hard Luck',  type: 'hard_luck', value: 0,     color: '#283593', textColor: '#ffffff' },
        ];

        let tg = null;
        let isSpinning = false;
        let audioCtx = null;

        const wheelEl = document.getElementById('wheel');
        const wheelWrapper = document.getElementById('wheelWrapper');
        const spinBtn = document.getElementById('spinBtn');
        const statusEl = document.getElementById('status');

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                starsContainer.appendChild(star);
            }
        }

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { console.log('Web Audio not supported:', e); }
        }

        function playTick() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.value = 800 + Math.random() * 400;
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function vibrate(pattern) {
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('medium'); } catch(e) {}
            }
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // ✅ بناء العجلة بـ conic-gradient + نصوص مستقيمة
        function buildWheel() {
            const segmentAngle = 360 / PRIZES.length;

            // خلفية العجلة
            const gradientStops = PRIZES.map((prize, index) => {
                const startAngle = index * segmentAngle;
                const endAngle = (index + 1) * segmentAngle;
                return `${prize.color} ${startAngle}deg ${endAngle}deg`;
            }).join(', ');

            wheelEl.style.background = `conic-gradient(from -36deg, ${gradientStops})`;
            wheelEl.innerHTML = '';

            // إضافة النصوص
            PRIZES.forEach((prize, index) => {
                const label = document.createElement('div');
                label.className = 'wheel-label';

                const centerAngle = (index * segmentAngle) + (segmentAngle / 2);

                // موضع النص على دائرة نصف قطرها 38% من مركز العجلة
                const radius = 38;
                const angleRad = (centerAngle - 90) * (Math.PI / 180);
                const x = 50 + radius * Math.cos(angleRad);
                const y = 50 + radius * Math.sin(angleRad);

                label.style.left = x + '%';
                label.style.top = y + '%';
                label.style.transform = `translate(-50%, -50%) rotate(${centerAngle}deg)`;
                label.style.color = prize.textColor;
                label.textContent = prize.name;

                wheelEl.appendChild(label);
            });
        }

        function setStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status ' + type;
        }

        function handleSpin() {
            if (isSpinning) return;
            if (!tg) {
                setStatus('❌ You must open from Telegram', 'error');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            wheelWrapper.classList.add('spinning');
            setStatus('🎲 Spinning...');

            if (!audioCtx) initAudio();
            vibrate(50);

            wheelEl.style.transition = 'none';
            wheelEl.style.animation = 'continuousSpin 0.8s linear infinite';

            const tickInterval = setInterval(() => {
                playTick();
            }, 100);

            setTimeout(() => {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'request_spin',
                        ts: Date.now()
                    }));
                    console.log('[SPIN] ✅ sendData sent');
                    clearInterval(tickInterval);
                    setStatus('✅ Check your bot messages!', 'success');
                } catch (err) {
                    console.error('[SPIN] sendData error:', err);
                    clearInterval(tickInterval);
                    setStatus('❌ Error, try again', 'error');
                    isSpinning = false;
                    spinBtn.disabled = false;
                    wheelWrapper.classList.remove('spinning');
                    wheelEl.style.animation = 'none';
                }
            }, 300);
        }

        function init() {
            createStars();
            buildWheel();

            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();

                try {
                    tg.setHeaderColor('#000000');
                    tg.setBackgroundColor('#0a1128');
                } catch (e) {}

                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    setStatus(`👋 Welcome ${user.first_name}! Press to spin`, '');
                } else {
                    setStatus('👋 Welcome! Press to spin', '');
                }

                spinBtn.disabled = false;
                spinBtn.textContent = '🎡 SPIN NOW';

                document.addEventListener('click', () => {
                    if (!audioCtx) initAudio();
                }, { once: true });

            } else {
                setStatus('⚠️ Open from Telegram bot', 'error');
                spinBtn.textContent = 'Not Available';
                spinBtn.disabled = true;
            }

            spinBtn.addEventListener('click', handleSpin);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
